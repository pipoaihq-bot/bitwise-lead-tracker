name: Pipo Daily Briefings

on:
  schedule:
    # Morning Brief: 03:00 UTC = 07:00 Dubai (GST = UTC+4), Mo-Fr
    - cron: '0 3 * * 1-5'
    # Evening Digest: 14:00 UTC = 18:00 Dubai, Mo-Fr
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning oder evening'
        default: 'morning'
        required: false
      top:
        description: 'Anzahl Leads (nur morning)'
        default: '5'
        required: false
      region:
        description: 'Region (leer = alle)'
        default: ''
        required: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Pipo Briefing
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Determine mode: evening cron (14:00 UTC) or manual input
          HOUR=$(date -u +%H)
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          if [ "$MODE" = "auto" ]; then
            if [ "$HOUR" -ge 12 ]; then
              MODE="evening"
            else
              MODE="morning"
            fi
          fi

          if [ "$MODE" = "evening" ]; then
            echo "Running Evening Digest..."
            python3 pipo_morning_brief.py --evening
          else
            echo "Running Morning Brief..."
            TOP="${{ github.event.inputs.top || '5' }}"
            REGION="${{ github.event.inputs.region }}"
            ARGS="--top $TOP"
            if [ -n "$REGION" ]; then
              ARGS="$ARGS --region $REGION"
            fi
            python3 pipo_morning_brief.py $ARGS
          fi
