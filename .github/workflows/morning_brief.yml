name: Pipo Morning Brief

on:
  schedule:
    # 03:00 UTC = 07:00 Dubai (GST = UTC+4)
    - cron: '0 3 * * 1-5'   # Mo–Fr automatisch
  workflow_dispatch:         # manuell auslösbar (Button in GitHub UI)
    inputs:
      top:
        description: 'Anzahl Leads'
        default: '5'
        required: false
      region:
        description: 'Region (leer = alle)'
        default: ''
        required: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --quiet supabase==2.28.0 anthropic>=0.34.0 requests

      - name: Run Pipo Morning Brief
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOP="${{ github.event.inputs.top || '5' }}"
          REGION="${{ github.event.inputs.region }}"
          ARGS="--top $TOP"
          if [ -n "$REGION" ]; then
            ARGS="$ARGS --region $REGION"
          fi
          python3 pipo_morning_brief.py $ARGS
